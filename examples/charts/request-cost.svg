<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" width="720" height="236" role="img" aria-label="Cost of one request by part: a miss costs 2.94 cents, no caching 2.49, a hit 0.87; only the instructions change." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="719" height="235" rx="6" fill="#ffffff" stroke="#d0d7de"/>
