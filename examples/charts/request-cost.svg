-weight="400">No caching</text><rect x="150" y="104" width="300" height="28" fill="#2f6fbd"/><rect x="450" y="104" width="40" height="28" fill="#8fb3e0"/><rect x="490" y="104" width="75" height="28" fill="#d98b2b"/><text x="573" y="123" font-size="13" fill="#1f2328" font-weight="600">2.49¢</text><text x="140" y="169" font-size="13" fill="#1f2328" text-anchor="end" font-weight="600">Hit</text><rect x="150" y="150" width="30" height="28" fill="#2f6fbd"/><rect x="180" y="150" width="40" height="28" fill="#8fb3e0"/><rect x="220" y="150" width="75" height="28" fill="#d98b2b"/><text x="303" y="169" font-size="13" fill="#1f2328" font-weight="600">0.87¢</text><text x="400" y="228" font-size="12" fill="#59636e" text-anchor="middle">Cost of one request, in cents</text>
